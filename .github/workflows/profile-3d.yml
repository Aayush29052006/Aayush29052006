# Regenerates the animated 3D contribution calendar shown on the profile README.
# Output is committed to profile-3d-contrib/ on main; the theme lives in
# .github/profile-3d-settings.json (orange-on-dark brand palette).
name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *" # daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile-3d-contrib/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: regenerate 3D contribution graph"; then
            git push
          fi
