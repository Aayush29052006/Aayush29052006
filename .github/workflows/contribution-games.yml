# Regenerates the contribution-graph games shown on the profile README:
# the snake (Platane/snk) and Pac-Man (abozanona/pacman-contribution-graph).
# Both write into dist/ and are pushed together to the `output` branch,
# because that push replaces the branch contents each run.
name: Generate contribution games

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF7A1A&color_dots=#ebedf0,#ffe3cc,#ffc28f,#ff9a4d,#FF7A1A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF7A1A&color_dots=#1C2128,#4a2810,#8a4515,#c95f17,#FF7A1A

      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
