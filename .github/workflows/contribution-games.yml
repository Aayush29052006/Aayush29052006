# Regenerates the contribution-graph games shown on the profile README:
# the snake (Platane/snk) and Pac-Man (abozanona/pacman-contribution-graph).
# Both write into dist/ and are pushed together to the `output` branch,
# because that push replaces the branch contents each run.
name: Generate contribution games

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#5b21b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C4B5FD&color_dots=#161B22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # The Pac-Man action has no colour options, so swap GitHub's contribution
      # greens for the profile's violet scale after it renders.
      - name: Recolour Pac-Man to the profile palette
        run: |
          sed -i -e 's/#0e4429/#2e1065/gI' -e 's/#006d32/#5b21b6/gI' \
                 -e 's/#26a641/#7c3aed/gI' -e 's/#39d353/#a78bfa/gI' \
                 dist/pacman-contribution-graph-dark.svg
          sed -i -e 's/#9be9a8/#ddd6fe/gI' -e 's/#40c463/#a78bfa/gI' \
                 -e 's/#30a14e/#7c3aed/gI' -e 's/#216e39/#5b21b6/gI' \
                 dist/pacman-contribution-graph.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
