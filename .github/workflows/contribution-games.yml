# Regenerates the contribution-graph games shown on the profile README:
# the snake (Platane/snk) and Pac-Man (abozanona/pacman-contribution-graph).
# Both write into dist/ and are pushed together to the `output` branch,
# because that push replaces the branch contents each run.
name: Generate contribution games

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#A78BFA&color_dots=#ebedf0,#4ade80,#fde047,#ffa94d,#ff5f6d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#22d3ee,#4ade80,#fde047,#ff5f6d

      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # The Pac-Man action has no colour options, so swap GitHub's contribution
      # greens for the profile's rainbow scale after it renders.
      - name: Recolour Pac-Man to the profile palette
        run: |
          sed -i -e 's/#0e4429/#22d3ee/gI' -e 's/#006d32/#4ade80/gI' \
                 -e 's/#26a641/#fde047/gI' -e 's/#39d353/#ff5f6d/gI' \
                 dist/pacman-contribution-graph-dark.svg
          sed -i -e 's/#9be9a8/#4ade80/gI' -e 's/#40c463/#fde047/gI' \
                 -e 's/#30a14e/#ffa94d/gI' -e 's/#216e39/#ff5f6d/gI' \
                 dist/pacman-contribution-graph.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
