# Refreshes the "Recent activity" list in README.md (between the
# START_SECTION:activity / END_SECTION:activity markers) with the most
# recently updated public projects and their latest commit.
name: Update recent activity

on:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild activity section
        run: python .github/scripts/update_activity.py
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if git commit -m "chore: refresh recent activity"; then
            git push
          fi
